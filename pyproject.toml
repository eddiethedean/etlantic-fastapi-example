[project]
name = "etlantic-fastapi-example"
version = "0.1.0"
description = "A durable FastAPI runner and scheduler for ETLantic pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "apscheduler>=3.11,<4",
    "cryptography>=45,<47",
    "etlantic==0.29.0",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
etlantic-ui = "etlantic_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etlantic_runner"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/etlantic_ui" = "etlantic_ui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "frontend"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"frontend/**" = ["E402", "E501"]
"tests/ui/**" = ["E501"]
